<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="./favicon_io/favicon-32x32.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="./marketing.css">
  <title>Login — Pulse</title>
  <style>
    .auth-layout { max-width: 480px; margin: 60px auto 100px; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-bolt"></i></span> Pulse</a>
    <button class="menu-button" aria-label="Open navigation" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
    <nav class="site-nav">
      <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
      <a href="about.html"><i class="fa-solid fa-circle-info"></i> About</a>
      <a href="features.html"><i class="fa-solid fa-star"></i> Features</a>
      <a href="contact.html"><i class="fa-solid fa-envelope"></i> Contact</a>
    </nav>
    <div class="nav-actions">
      <a class="login-link active" href="login.html">Log in</a>
      <a class="button button-small" href="sign-up.html">Get started</a>
    </div>
  </header>

  <main>
    <section class="section auth-layout">
      <div class="section-heading centered reveal">
        <h2>Welcome back</h2>
        <p>Log in to access your dashboard.</p>
      </div>
      <form class="contact-form reveal delay-1" id="loginForm">
        <label>Username
          <input type="text" id="username" name="username" required placeholder="Alex Sharma">
        </label>
        <label>Password
          <input type="password" id="password" name="password" required placeholder="••••••••">
        </label>
        <button class="button" type="submit" style="width: 100%; justify-content: center; margin-top: 15px;">Log in <i class="fa-solid fa-arrow-right"></i></button>
        <p style="text-align: center; margin-top: 20px; font-size: 13px;"><a href="#" style="color: var(--green); font-weight: 800;">Forgot Password?</a></p>
        <p class="form-message">Logging you in...</p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <a class="brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-bolt"></i></span> Pulse</a>
    <p>Personal finance, made clear.</p>
    <div>
      <a href="about.html">About</a>
      <a href="features.html">Features</a>
      <a href="contact.html">Contact</a>
    </div>
    <small>© 2026 Pulse Finance.</small>
  </footer>

  <script src="./marketing.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
      event.preventDefault();
      this.querySelector('.form-message').classList.add('show');
      // Set authentication flag
      localStorage.setItem('isLoggedIn', 'true');
      // Redirect to tracker page
      setTimeout(() => {
        window.location.href = './Personal-Finance-Tracker-main/index.html';
      }, 800);
    });
  </script>
</body>
</html>
