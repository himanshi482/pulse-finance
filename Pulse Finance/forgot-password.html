<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="./favicon_io/favicon-32x32.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="./marketing.css">
  <title>Forgot Password — Pulse</title>
  <style>
    .auth-layout { max-width: 480px; margin: 60px auto 100px; }
    .password-hint { font-size: 12px; color: #888; margin-top: 4px; }
    .input-group { position: relative; }
    .toggle-pass {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: #888;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-bolt"></i></span> Pulse</a>
    <button class="menu-button" aria-label="Open navigation" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
    <nav class="site-nav">
      <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
      <a href="about.html"><i class="fa-solid fa-circle-info"></i> About</a>
      <a href="features.html"><i class="fa-solid fa-star"></i> Features</a>
      <a href="contact.html"><i class="fa-solid fa-envelope"></i> Contact</a>
    </nav>
    <div class="nav-actions">
      <a class="login-link active" href="login.html">Log in</a>
      <a class="button button-small" href="sign-up.html">Get started</a>
    </div>
  </header>

  <main>
    <section class="section auth-layout">
      <div class="section-heading centered reveal">
        <h2>Reset Your Password</h2>
        <p>Enter your email or username and choose a new password.</p>
      </div>

      <form class="contact-form reveal delay-1" id="resetPasswordForm">
        <label>Email or Username
          <input type="text" id="userIdentifier" name="userIdentifier" required placeholder="Alex Sharma or alex@example.com">
        </label>

        <label>Create New Password
          <div class="input-group">
            <input type="password" id="newPassword" name="newPassword" required minlength="6" placeholder="••••••••">
          </div>
          <p class="password-hint">Must be at least 6 characters</p>
        </label>

        <label>Confirm New Password
          <div class="input-group">
            <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" placeholder="••••••••">
          </div>
        </label>

        <button class="button" type="submit" style="width: 100%; justify-content: center; margin-top: 15px;">
          <i class="fa-solid fa-key"></i> Reset Password
        </button>

        <p style="text-align: center; margin-top: 20px; font-size: 14px;">
          Remembered your password? <a href="login.html" style="color: var(--green); font-weight: 800;">Log in here</a>
        </p>

        <p class="form-message" id="resetFormMessage"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <a class="brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-bolt"></i></span> Pulse</a>
    <p>Personal finance, made clear.</p>
    <div>
      <a href="about.html">About</a>
      <a href="features.html">Features</a>
      <a href="contact.html">Contact</a>
    </div>
    <small>© 2026 Pulse Finance.</small>
  </footer>

  <script src="./marketing.js"></script>
  <script>
    const resetForm = document.getElementById('resetPasswordForm');
    const formMessage = document.getElementById('resetFormMessage');

    resetForm.addEventListener('submit', async function(event) {
      event.preventDefault();

      const userIdentifier = document.getElementById('userIdentifier').value.trim();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!userIdentifier) {
        formMessage.style.color = '#d9534f';
        formMessage.textContent = 'Please enter your registered email or username.';
        formMessage.classList.add('show');
        return;
      }

      if (newPassword !== confirmPassword) {
        formMessage.style.color = '#d9534f';
        formMessage.textContent = 'New Password and Confirm Password do not match.';
        formMessage.classList.add('show');
        return;
      }

      if (newPassword.length < 6) {
        formMessage.style.color = '#d9534f';
        formMessage.textContent = 'Password must be at least 6 characters long.';
        formMessage.classList.add('show');
        return;
      }

      formMessage.style.color = 'var(--ink)';
      formMessage.textContent = 'Resetting your password...';
      formMessage.classList.add('show');

      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: userIdentifier, username: userIdentifier, newPassword, confirmPassword })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Password reset failed. Please try again.');
        }

        formMessage.style.color = 'var(--green)';
        formMessage.textContent = data.message || 'Password reset successfully! Redirecting to login...';

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1500);
      } catch (err) {
        formMessage.style.color = '#d9534f';
        formMessage.textContent = err.message;
      }
    });
  </script>
</body>
</html>
